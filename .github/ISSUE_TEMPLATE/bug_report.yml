name: Bug Report
description: Report a problem
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package/project version
      placeholder: "x.y.z"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: e.g. PHP version, OS, browser; whatever's relevant to this project.
      placeholder: "PHP 8.3, macOS 15"
    validations:
      required: false
